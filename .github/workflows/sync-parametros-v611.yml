name: sync-parametros-v611

# Carga mensual de parámetros previsionales (UF, UTM, topes, SIS, impuesto único,
# asignación familiar, AFC, IPS...) desde fuentes oficiales (PreviRed, SII, SP, IPS)
# usando el pipeline de etl/parametros. Ver etl/parametros/README.md.

on:
  schedule:
    # Días 3, 6 y 9 a las 12:00 UTC. PreviRed publica los indicadores en los primeros
    # días del mes; las corridas extra son reintentos (el SQL es reejecutable).
    - cron: "0 12 3,6,9 * *"
  workflow_dispatch:
    inputs:
      periodo:
        description: "Periodo YYYY-MM (vacío = mes actual en Chile)"
        required: false
        default: ""
      aplicar:
        description: "Aplicar SQL en PRODUCCIÓN (solo funciona desde main)"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: sync-parametros-v611
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Genera y prueba el SQL sin secretos: se puede correr desde cualquier rama.
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      periodo: ${{ steps.periodo.outputs.periodo }}
    defaults:
      run:
        working-directory: etl/parametros

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/parametros/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Resolver periodo
        id: periodo
        env:
          PERIODO_INPUT: ${{ inputs.periodo }}
        run: |
          p="${PERIODO_INPUT:-}"
          if [ -z "$p" ]; then p="$(TZ=America/Santiago date +%Y-%m)"; fi
          if ! [[ "$p" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error::Periodo inválido: $p (formato YYYY-MM)"; exit 1
          fi
          echo "periodo=$p" >> "$GITHUB_OUTPUT"
          echo "Periodo: $p"

      - name: Tests del pipeline
        run: python -m pytest -q

      - name: Generar JSON + SQL (fuentes estrictas)
        env:
          PYTHONIOENCODING: utf-8
        run: >
          python 00_ejecutar_flujo_parametros_v611.py
          --periodo "${{ steps.periodo.outputs.periodo }}"
          --modo full
          --strict-sources
          --seed skip

      - name: Subir artefactos del periodo
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: parametros-${{ steps.periodo.outputs.periodo }}
          path: etl/parametros/runs/${{ steps.periodo.outputs.periodo }}
          if-no-files-found: warn
          retention-days: 90

  # Escribe en PRODUCCIÓN. SUPABASE_DB_URL vive en el Environment `produccion-db`,
  # que solo acepta la rama main: desde otra rama este job falla sin ver el secreto.
  aplicar:
    needs: generar
    if: github.event_name == 'schedule' || inputs.aplicar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: produccion-db
    env:
      PERIODO: ${{ needs.generar.outputs.periodo }}

    steps:
      - name: Descargar SQL generado
        uses: actions/download-artifact@v5
        with:
          name: parametros-${{ needs.generar.outputs.periodo }}
          path: runs/${{ needs.generar.outputs.periodo }}

      - name: Instalar psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Preparar conexión
        env:
          SECRETO: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Tolera los errores de pegado más comunes: espacios/saltos de línea,
          # comillas alrededor y el prefijo "SUPABASE_DB_URL=" copiado desde .env.
          url="$(printf '%s' "$SECRETO" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
          url="${url#SUPABASE_DB_URL=}"
          url="${url#\"}"; url="${url%\"}"; url="${url#\'}"; url="${url%\'}"
          if [ -z "$url" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL en el Environment produccion-db (URL del pooler de Supabase)."
            exit 1
          fi
          echo "::add-mask::$url"
          if ! [[ "$url" =~ ^postgres(ql)?:// ]]; then
            echo "::error::SUPABASE_DB_URL no empieza con postgresql:// (largo ${#url}, primer carácter '${url:0:1}' oculto si es parte del secreto). Pega solo la URL, sin comillas ni 'SUPABASE_DB_URL='."
            exit 1
          fi
          if [[ "$url" =~ @db\.[^.]+\.supabase\.co ]]; then
            echo "::warning::La URL es la conexión directa (IPv6). Usa la del pooler (*.pooler.supabase.com)."
          fi
          echo "PGURL=$url" >> "$GITHUB_ENV"

      - name: Aplicar SQL en Supabase
        run: |
          psql "$PGURL" -X -q -v ON_ERROR_STOP=1 \
            -f "runs/${PERIODO}/mensual/parametros_mensuales_${PERIODO}_v611.sql"

      - name: Verificar carga
        run: |
          resultado="$(psql "$PGURL" -X -q -A -t -v ON_ERROR_STOP=1 -v periodo="$PERIODO" <<'SQL'
          select count(*) || ' ' || coalesce(max(uf)::text, '-') || ' ' || coalesce(max(utm)::text, '-')
          from public.parametros_generales where periodo = :'periodo';
          SQL
          )"
          echo "parametros_generales $PERIODO -> filas/UF/UTM: $resultado"
          case "$resultado" in
            1\ *) echo "OK" ;;
            *) echo "::error::No quedó exactamente una fila de parametros_generales para $PERIODO"; exit 1 ;;
          esac
