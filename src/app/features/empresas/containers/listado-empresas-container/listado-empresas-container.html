<section class="emp-page" aria-label="Empresas">
  <header class="emp-head">
    <p class="emp-lead">
      Administra los datos tributarios, de contacto y mutual de cada empresa operativa del sistema.
    </p>
    <div class="emp-head-actions">
      <app-button variant="outline" size="md" (click)="cargar()">
        <lucide-icon icon class="w-4 h-4" [img]="refreshIcon"></lucide-icon>
        Refrescar
      </app-button>
      <app-button variant="primary" size="md" (click)="irNuevaEmpresa()">
        <lucide-icon icon class="w-4 h-4" [img]="plusIcon"></lucide-icon>
        Nueva empresa
      </app-button>
    </div>
  </header>

  @if (mensajeError(); as error) {
    <p class="emp-field-error" role="alert">{{ error }}</p>
  }

  <div class="emp-grid-wrap">
    <app-data-grid
      title="Empresas"
      [rows]="filas()"
      [columns]="columns"
      [filters]="filters"
      [filtersEnabled]="true"
      [loading]="cargando()"
      [showExportAction]="true"
      [selectable]="false"
      [trackBy]="trackEmpresa"
      [persistenceKey]="persistenceKey"
      gridHeight="min(560px, 100%)"
      emptyTitle="No hay empresas registradas"
      emptyDescription="Crea la primera empresa para operar contratos y mutual empleador."
      (refresh)="cargar()"
    >
      <ng-template appDataGridCell="aplicaMutual" let-row>
        @if (row.aplicaMutual) {
          <span class="emp-chip emp-chip--ok">Sí</span>
        } @else {
          <span class="emp-chip emp-chip--muted">No</span>
        }
      </ng-template>
      <ng-template appDataGridCell="acciones" let-row>
        <button type="button" class="emp-link-btn" (click)="revisarEmpresa(row)">Revisar datos</button>
      </ng-template>
    </app-data-grid>
  </div>
</section>
