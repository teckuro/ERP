<section class="emp-list__page" aria-label="Empresas">
  @if (mensajeError(); as error) {
    <app-message-box
      variant="error"
      [message]="error"
      primaryLabel="Reintentar"
      (action)="cargar()"
    ></app-message-box>
  }

  <div class="emp-list__grid-shell" aria-labelledby="emp-list-grid-title">
    <h2 id="emp-list-grid-title" class="sr-only">Listado de empresas</h2>

    <section class="emp-list__franja-operativa" aria-label="Contexto del listado">
      <p class="emp-list__franja-operativa__lead">{{ subtitulo() }}</p>
    </section>

      <app-data-grid
        title="Empresas"
        primaryActionLabel="Nueva empresa"
        [primaryActionDisabled]="cargando()"
        (primaryAction)="irNuevaEmpresa()"
        [rows]="filas()"
        [columns]="columns"
        [filters]="filters"
        [filtersEnabled]="true"
        [filtersCollapsible]="true"
        [loading]="cargando()"
        loadingLabel="Cargando empresas…"
        [showExportAction]="true"
        [selectable]="false"
        [trackBy]="trackEmpresa"
        [persistenceKey]="persistenceKey"
        [gridHeight]="'100%'"
        emptyTitle="Sin empresas registradas"
        emptyDescription="Crea la primera empresa para configurar contratos y mutual empleador."
        emptyTitleWhenFiltered="No hay empresas que coincidan con los filtros."
        emptyDescriptionWhenFiltered="Ajusta la búsqueda o limpia filtros para ver más resultados."
        className="emp-list__grid"
        cardClassName="emp-list__grid-card erp-fullscreen-grid-card"
        (refresh)="cargar()"
      >
        <ng-template appDataGridCell="aplicaMutual" let-row>
          @if (row.aplicaMutual) {
            <span class="emp-list__chip emp-list__chip--success">
              <span class="emp-list__chip-dot" aria-hidden="true"></span>
              Sí
            </span>
          } @else {
            <span class="emp-list__chip emp-list__chip--muted">No</span>
          }
        </ng-template>
        <ng-template appDataGridCell="acciones" let-row>
          <div class="emp-list__row-actions" (click)="$event.stopPropagation()">
            <button
              type="button"
              class="emp-list__row-action"
              (click)="revisarEmpresa(row)"
              [attr.aria-label]="'Revisar ' + row.razonSocial"
              [title]="'Revisar ' + row.razonSocial"
            >
              <lucide-icon name="pencil" aria-hidden="true"></lucide-icon>
            </button>
          </div>
        </ng-template>
      </app-data-grid>
  </div>
</section>
