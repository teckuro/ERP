@if (abierto()) {
  @if (cargando()) {
    <app-workspace-loading
      scope="viewport"
      title="Preparando archivo Previred"
      [message]="'Consultando liquidación de ' + (etiquetaNomina() || 'la nómina seleccionada') + '…'"
    />
  } @else {
    <app-message-box
      mode="modal"
      [variant]="variantModal()"
      width="md"
      panelClass="prev-exp-modal"
      eyebrow="Previred"
      [title]="tituloModal()"
      [message]="mensajeModal()"
      [sections]="seccionesModal()"
      [primaryLabel]="puedeDescargar() && !tieneBloqueoExportacion() ? 'Descargar archivo' : errorCarga() ? 'Cerrar' : 'Entendido'"
      [secondaryLabel]="puedeDescargar() && !tieneBloqueoExportacion() ? 'Cancelar' : ''"
      [tertiaryLabel]="etiquetaDetalleConceptos() ?? ''"
      [disableClose]="registrando() || detalleConceptosAbierto()"
      (action)="onAccionPrincipal()"
      (secondary)="onCerrar()"
      (tertiary)="onAbrirDetalleConceptos()"
      (dismiss)="onCerrar()"
    />

    @if (detalleConceptosAbierto()) {
      <app-message-box
        mode="modal"
        variant="info"
        width="md"
        panelClass="prev-exp-modal prev-exp-modal--detalle"
        eyebrow="Previred · Detalle"
        title="Conceptos excluidos del archivo"
        [message]="mensajeDetalleConceptos()"
        [sections]="seccionesDetalleConceptos()"
        primaryLabel="Volver"
        (action)="onCerrarDetalleConceptos()"
        (dismiss)="onCerrarDetalleConceptos()"
      />
    }
  }
}
