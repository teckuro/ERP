<section class="lm-page" aria-label="Licencias médicas">
  @if (alertaPendientesVisible()) {
    <app-message-box
      variant="warning"
      mode="modal"
      title="Licencias pendientes de revisión"
      [message]="mensajeAlertaPendientes()"
      primaryLabel="Revisar ahora"
      secondaryLabel="Más tarde"
      (action)="revisarPendientesDesdeAlerta()"
      (secondary)="cerrarAlertaPendientes()"
      (dismiss)="cerrarAlertaPendientes()"
    />
  }

  @if (mensajeError()) {
    <app-message-box
      variant="error"
      mode="inline"
      title="No fue posible completar la operación"
      [message]="mensajeError()!"
      primaryLabel="Cerrar"
      (action)="mensajeError.set(null)"
    />
  }

  @if (mensajeExito()) {
    <app-message-box
      variant="success"
      mode="inline"
      title="Operación completada"
      [message]="mensajeExito()!"
      primaryLabel="Aceptar"
      (action)="mensajeExito.set(null)"
    />
  }

  <div class="lm-grid-shell">
    <section class="lm-franja-operativa" aria-label="Contexto de licencias médicas">
      <p class="lm-franja-operativa__lead">
        Licencias recibidas por correo. Revise folio, trabajador y vigencia antes de vincular movimientos del mes.
      </p>
    </section>

    <app-data-grid
        className="lm-grid"
        title="Licencias médicas"
        primaryActionLabel="Registrar manual"
        [primaryActionDisabled]="guardando() || loading()"
        (primaryAction)="abrirRegistroManual()"
        [rows]="filas()"
        [columns]="columns"
        [filters]="filters"
        [filtersEnabled]="true"
        [filtersCollapsible]="true"
        [loading]="loading()"
        loadingLabel="Cargando licencias médicas…"
        [showExportAction]="false"
        [selectable]="false"
        [trackBy]="trackRow"
        [gridHeight]="'100%'"
        cardClassName="lm-grid-card erp-fullscreen-grid-card"
        (refresh)="cargar({ silenciarAlertaPendientes: true })"
        emptyTitle="Sin licencias médicas registradas"
        emptyDescription="Reenvíe el correo oficial a la casilla del ERP o registre una licencia manualmente."
        emptyTitleWhenFiltered="No hay licencias que coincidan con los filtros aplicados."
        emptyDescriptionWhenFiltered="Ajuste la búsqueda o restablezca los filtros para ampliar el listado."
      >
        <ng-template appDataGridCell="folio" let-row>
          <button type="button" class="lm-link" (click)="onRowOpen(row)">
            {{ row.folio || 'Sin folio' }}
          </button>
        </ng-template>
      </app-data-grid>
  </div>

  @if (licenciaSeleccionada(); as licencia) {
    <app-licencia-medica-revision-drawer
      [licencia]="licencia"
      [ingreso]="ingresoSeleccionado()"
      [empleados]="empleados()"
      [guardando]="guardando()"
      (cerrar)="cerrarRevision()"
      (guardarBorrador)="guardarBorradorDrawer()"
      (confirmarVincular)="confirmarDrawer()"
      (rechazar)="rechazarDrawer()"
    />
  }
</section>
