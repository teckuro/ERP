<section class="listado-page" aria-label="Listado de empleados">
  <div class="listado-grid-shell">
    <section class="listado-franja-operativa" aria-label="Contexto del listado">
      <p class="listado-franja-operativa__lead">
        Gestione el personal activo y acceda a la ficha de cada trabajador.
      </p>
    </section>
    <app-tabla-empleados
      #tabla
      class="block w-full min-w-0"
      [empleados]="empleados()"
      [loading]="cargando()"
      [mensajeError]="mensajeError() ?? ''"
      [bulkActionLoading]="cargandoAccionMasiva()"
      [bulkActionResult]="resultadoAccionMasiva()"
      [destinoNavegacionCreacion]="destinoNavegacionCreacion()"
      (createBasico)="crearBasico()"
      (createAvanzado)="crearAvanzado()"
      (bulkAction)="manejarAccionMasiva($event)"
      (refresh)="cargarEmpleados()"
    ></app-tabla-empleados>
  </div>
</section>
