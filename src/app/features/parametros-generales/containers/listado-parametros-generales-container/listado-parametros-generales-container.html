<section class="parametros-page parametros-page--listado" aria-label="Parámetros generales">
  @if (errorCargaDetalle(); as errDet) {
    <app-message-box
      variant="error"
      mode="modal"
      title="No fue posible completar la operación"
      message="No fue posible cargar el listado de parámetros generales."
      [detail]="errDet"
      primaryLabel="Aceptar"
      (action)="cerrarErrorCarga()"
    ></app-message-box>
  }

  <div class="parametros-grid-shell">
    <section class="param-franja-operativa" aria-label="Contexto del listado">
      <p class="param-franja-operativa__lead">
        Indicadores previsionales y tributarios por período. Use el workspace de parámetros para editar el período activo.
      </p>
    </section>

    <app-tabla-parametros-generales
      class="block w-full min-w-0"
      [rows]="rows()"
      [loading]="isLoading()"
      [mensajeError]="''"
      (refresh)="loadRows()"
    ></app-tabla-parametros-generales>
  </div>
</section>
