<section class="payroll-page payroll-ledger-shell" aria-label="Nómina mensual">
  @let frame = nominaFrame();

  <header class="payroll-head payroll-head--workspace">
    <app-record-breadcrumb [items]="breadcrumbItems" title="Nómina mensual"></app-record-breadcrumb>
    <div class="payroll-title-row">
      <div class="payroll-title-row__main">
        <h1>Nómina mensual</h1>
        <span class="payroll-status-chip">{{ frame.chip }}</span>
      </div>
      <p class="payroll-lead">
        Genera la nómina del período, revisa trabajadores y confirma la versión que será base para liquidaciones.
      </p>
    </div>
    <div class="payroll-period-box" aria-live="polite">
      <span>Período</span>
      <strong>{{ periodoActivo.etiqueta() }}</strong>
    </div>
  </header>

  @if (errorEjecucion() && overlay().kind !== 'informacion') {
    <div class="payroll-ledger-error" role="alert">{{ errorEjecucion() }}</div>
  }

  <app-proceso-mensual-workspace />

  <app-proceso-mensual-overlays />
</section>
