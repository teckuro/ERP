@let f = facade;
@switch (f.overlay().kind) {
  @case ('revision') {
    <app-proceso-mensual-detalle-modal />
  }
  @case ('informacion') {
    <app-proceso-mensual-informacion-modal />
  }
  @case ('decision') {
    @let confirmacion = f.confirmacionProceso()!;
    <app-message-box
      [variant]="confirmacion.variant ?? 'decision'"
      mode="modal"
      [eyebrow]="confirmacion.eyebrow ?? ''"
      [title]="confirmacion.titulo"
      [message]="confirmacion.mensaje"
      detail=""
      [sections]="sectionsConfirmacion(confirmacion)"
      [actions]="actionsConfirmacion(confirmacion)"
      (action)="f.confirmarAccionProceso()"
      (secondary)="f.cancelarAccionProceso()"
      (dismiss)="f.cancelarAccionProceso()"
    />
  }
}
