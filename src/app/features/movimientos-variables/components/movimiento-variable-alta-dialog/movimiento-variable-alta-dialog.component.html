<div class="mv-dialog-root" role="presentation">
  <div class="mv-dialog-backdrop" (click)="cerrar.emit()"></div>
  <div class="mv-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="mv-alta-title">
    <h2 id="mv-alta-title" class="mv-dialog-title">Registrar movimiento</h2>
    <p class="mv-dialog-sub">
      Período activo: <strong>{{ periodoEtiqueta() }}</strong> - Origen: manual
    </p>

    <div class="mv-dialog-body">
      <div class="mv-dialog-group">
        <div class="mv-dialog-span2">
          <label class="mv-dialog-field-label" for="mv-emp">Trabajador</label>
          <app-search-select
            id="mv-emp"
            [options]="empleadoOpciones()"
            [ngModel]="idPersona()"
            (ngModelChange)="idPersonaChange.emit($event)"
            placeholder="Buscar por nombre o RUT"
            searchPlaceholder="Filtrar lista"
          ></app-search-select>
        </div>
        <div class="mv-dialog-span2">
          <label class="mv-dialog-field-label" for="mv-concepto">Concepto</label>
          <app-search-select
            id="mv-concepto"
            [options]="conceptoOpciones()"
            [ngModel]="idConcepto()"
            (ngModelChange)="idConceptoChange.emit($event)"
            placeholder="Seleccione concepto"
            searchPlaceholder="Buscar concepto"
          ></app-search-select>
        </div>
      </div>
      <div class="mv-dialog-group">
        <div>
          <label class="mv-dialog-field-label" for="mv-monto">Monto</label>
          <input
            id="mv-monto"
            type="number"
            min="0"
            step="1"
            class="mv-dialog-input"
            [ngModel]="monto()"
            (ngModelChange)="montoChange.emit($event)"
          />
        </div>
        <div>
          <label class="mv-dialog-field-label" for="mv-estado-alta">Estado al crear</label>
          <select
            id="mv-estado-alta"
            class="mv-dialog-input"
            [ngModel]="estadoAlta()"
            (ngModelChange)="estadoAltaChange.emit($event)"
          >
            <option [ngValue]="'BORRADOR'">Borrador</option>
            <option [ngValue]="'VALIDADO'">Validado</option>
          </select>
        </div>
        <div class="mv-dialog-span2">
          <label class="mv-dialog-field-label" for="mv-obs">Observación</label>
          <textarea
            id="mv-obs"
            class="mv-dialog-input mv-dialog-textarea"
            rows="3"
            [ngModel]="observacion()"
            (ngModelChange)="observacionChange.emit($event)"
            placeholder="Opcional"
          ></textarea>
        </div>
      </div>
    </div>

    <div class="mv-dialog-actions">
      <button type="button" class="mv-dialog-btn mv-dialog-btn--ghost" [disabled]="guardando()" (click)="cerrar.emit()">
        Cancelar
      </button>
      <button type="button" class="mv-dialog-btn mv-dialog-btn--primary" [disabled]="guardando()" (click)="guardar.emit()">
        @if (guardando()) {
          Guardando...
        } @else {
          Guardar
        }
      </button>
    </div>
  </div>
</div>
