<div
  class="liq-preview__backdrop"
  role="dialog"
  aria-modal="true"
  aria-labelledby="liq-preview-title"
>
  <div class="liq-preview__modal">
    <header class="liq-preview__chrome">
      <div class="liq-preview__chrome-copy">
        <p class="liq-preview__chrome-eyebrow">{{ chromeEyebrow() }}</p>
        <h2 id="liq-preview-title" class="liq-preview__chrome-title">
          Liquidación de remuneraciones
        </h2>
        <p class="liq-preview__chrome-subtitle">
          {{ chromeSubtitle() }}
        </p>
      </div>
      <div class="liq-preview__chrome-actions">
        <button
          type="button"
          class="liq-preview__btn liq-preview__btn--icon"
          (click)="emitirImprimir()"
          title="Imprimir o guardar como PDF"
          aria-label="Imprimir liquidación"
        >
          <lucide-icon [img]="printIcon" aria-hidden="true"></lucide-icon>
        </button>
        <button
          type="button"
          class="liq-preview__btn liq-preview__btn--close"
          (click)="emitirCerrar()"
          aria-label="Cerrar previsualización"
        >
          <lucide-icon [img]="closeIcon" aria-hidden="true"></lucide-icon>
        </button>
      </div>
    </header>

    <div class="liq-preview__scroll">
      <app-liquidacion-documento-sheet [vista]="vistaSheet()" [compact]="true" />
    </div>
  </div>
</div>
