<section class="nmv2-page" [attr.data-step]="currentStep()">
  <app-nomina-mensual-v2-stepper
    [pasoActual]="currentStep()"
    [steps]="steps"
    (pasoSeleccionado)="intentarIrAPaso($event)"
  />

  <header class="nmv2-screen-header">
    <div class="nmv2-screen-copy">
      <h1>{{ pageTitle() }}</h1>
      <p>{{ pageSubtitle() }}</p>
      @if (orquestador.ayudaAvance(); as ayudaAvance) {
        <p
          class="nmv2-step-nav-hint"
          [class.nmv2-step-nav-hint--bloqueo]="orquestador.tonoAyudaAvance() === 'bloqueo'"
          [class.nmv2-step-nav-hint--revision]="orquestador.tonoAyudaAvance() === 'revision'"
        >{{ ayudaAvance }}</p>
      }
    </div>
  </header>

  @switch (currentStep()) {
    @case ('parameters') {
      <app-nomina-mensual-v2-paso-parametros
        (avanceSolicitado)="manejarAvanceDesdeParametros($event)"
        (resumenActualizado)="syncShellContext()"
      />
    }
    @case ('employees') {
      <app-nomina-mensual-v2-paso-empleados
        (avanceSolicitado)="manejarAvanceDesdeEmpleados()"
        (volverParametros)="intentarIrAPaso('parameters')"
      />
    }
    @default {
      <app-nomina-mensual-v2-pasos-demostracion [paso]="currentStep()" />
    }
  }

  <app-nomina-mensual-v2-overlays
    (confirmarAvanceConRevision)="confirmarAvanceConRevision()"
    (irAPendientesParametros)="irAPendientesParametros()"
    (irAPendientesEmpleados)="irAPendientesEmpleados()"
    (verEnGrillaEmpleados)="verEnGrillaEmpleados($event)"
    (confirmarAvanceConAdvertenciaEmpleados)="confirmarAvanceConAdvertenciaEmpleados()"
    (reintentarValidacionEmpleados)="reintentarValidacionEmpleados()"
  />
</section>
