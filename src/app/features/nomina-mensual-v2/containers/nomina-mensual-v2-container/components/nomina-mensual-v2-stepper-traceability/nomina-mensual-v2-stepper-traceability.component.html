<div class="nomina-stepper-traceability" aria-label="Trazabilidad del paso actual">
  <span class="nomina-stepper-traceability__heading">Detalle del paso</span>

  <button
    type="button"
    class="nomina-stepper-traceability__action nomina-stepper-traceability__action--owner"
    [title]="resumen().responsableTooltip"
    (click)="abrirResponsable()"
  >
    <span class="nomina-stepper-traceability__icon" aria-hidden="true">
      @if (inicialesResponsable(); as iniciales) {
        <span class="nomina-stepper-traceability__avatar">{{ iniciales }}</span>
      } @else {
        <lucide-icon name="user-round" aria-hidden="true"></lucide-icon>
      }
    </span>
    <span class="nomina-stepper-traceability__copy">
      <span class="nomina-stepper-traceability__label">Responsable</span>
      <strong>{{ resumen().responsableNombre }}</strong>
    </span>
  </button>

  <button
    type="button"
    class="nomina-stepper-traceability__action nomina-stepper-traceability__action--history"
    [title]="'Ver historial del paso\n' + resumen().ultimoEvento"
    (click)="abrirHistorial()"
  >
    <span class="nomina-stepper-traceability__icon" aria-hidden="true">
      <lucide-icon name="history" aria-hidden="true"></lucide-icon>
    </span>
    <span class="nomina-stepper-traceability__copy">
      <span class="nomina-stepper-traceability__label">Historial</span>
      <strong>{{ resumen().ultimoEvento }}</strong>
    </span>
  </button>

  <button
    type="button"
    class="nomina-stepper-traceability__action nomina-stepper-traceability__action--integrity"
    [class.nomina-stepper-traceability__action--ok]="resumen().integridadEstado === 'verificadoServidor'"
    [class.nomina-stepper-traceability__action--warn]="resumen().integridadEstado === 'pendiente' || resumen().integridadEstado === 'invalidado'"
    [title]="tooltipModalIntegridad()"
    aria-haspopup="dialog"
    (click)="abrirModalIntegridad()"
  >
    <span class="nomina-stepper-traceability__icon" aria-hidden="true">
      <lucide-icon [name]="resumen().iconoIntegridad" aria-hidden="true"></lucide-icon>
    </span>
    <span class="nomina-stepper-traceability__copy">
      <span class="nomina-stepper-traceability__label">Integridad</span>
      <strong>{{ resumen().integridadLabel }}</strong>
    </span>
  </button>

  <button
    type="button"
    class="nomina-stepper-traceability__action nomina-stepper-traceability__action--meta"
    [title]="tooltipFecha()"
    hidden
  >
    <span class="nomina-stepper-traceability__icon" aria-hidden="true">
      <lucide-icon name="calendar-clock" aria-hidden="true"></lucide-icon>
    </span>
    <span class="nomina-stepper-traceability__copy">
      <span class="nomina-stepper-traceability__label">Fecha</span>
      <strong>{{ resumen().fechaUltimoEvento }}</strong>
    </span>
  </button>

  <button
    type="button"
    class="nomina-stepper-traceability__action nomina-stepper-traceability__action--compact"
    title="Ver trazabilidad completa del flujo"
    (click)="abrirDrawerCompleto()"
    hidden
  >
    <span class="nomina-stepper-traceability__icon" aria-hidden="true">
      <lucide-icon name="panel-right-open" aria-hidden="true"></lucide-icon>
    </span>
    <span class="nomina-stepper-traceability__copy">
      <span class="nomina-stepper-traceability__label">Flujo</span>
      <strong>Completa</strong>
    </span>
  </button>

  @if (muestraAlerta()) {
    <button
      type="button"
      class="nomina-stepper-traceability__action nomina-stepper-traceability__action--alert nomina-stepper-traceability__action--compact"
      [title]="tooltipAlerta()"
      (click)="abrirHistorial()"
      hidden
    >
      <span class="nomina-stepper-traceability__icon" aria-hidden="true">
        <lucide-icon name="triangle-alert" aria-hidden="true"></lucide-icon>
      </span>
      <span class="nomina-stepper-traceability__copy">
        <span class="nomina-stepper-traceability__label">Estado</span>
        <strong>Revisar</strong>
      </span>
    </button>
  }
</div>
