<div class="nmv2-stepper-card nomina-shell">
  <nav class="nmv2-stepper nomina-stepper" aria-label="Flujo de nómina mensual">
    @for (step of steps; track step.id) {
      <button
        type="button"
        class="step nomina-step"
        [class.nomina-step--active]="estadoPaso(step.id) === 'active'"
        [class.nomina-step--complete]="estadoPaso(step.id) === 'completed'"
        [class.nomina-step--pending]="estadoPaso(step.id) === 'pending'"
        [class.active]="estadoPaso(step.id) === 'active'"
        [class.completed]="estadoPaso(step.id) === 'completed'"
        (click)="seleccionarPaso(step.id)"
      >
        <span class="step-number">
          @if (estadoPaso(step.id) === 'completed') {
            <lucide-icon name="check" aria-hidden="true"></lucide-icon>
          } @else {
            <span>{{ step.number }}</span>
          }
        </span>
        <span class="step-copy">
          <strong>{{ step.title }}</strong>
          <small>{{ estadoPaso(step.id) === 'completed' ? 'Completo' : step.subtitle }}</small>
        </span>
      </button>
    }
  </nav>
</div>
