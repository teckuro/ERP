<button
  type="button"
  class="nmv2-trazabilidad-paso"
  [class.nmv2-trazabilidad-paso--compact]="compacto()"
  (click)="abrirDetalle()"
  [attr.aria-label]="'Ver trazabilidad del paso'"
>
  <span class="nmv2-trazabilidad-paso__copy">
    <lucide-icon name="shield-check" aria-hidden="true"></lucide-icon>
    <span>{{ lineaResumen() }}</span>
    <em>{{ etiquetaIntegridad() }}</em>
  </span>
  <lucide-icon class="nmv2-trazabilidad-paso__icon" name="history" aria-hidden="true"></lucide-icon>
</button>
