@if (variant() === 'panel') {
  <section class="nmv2-trazabilidad-panel">
    <header class="nmv2-trazabilidad-panel__head">
      <h3>Registro del paso</h3>
      <p>{{ tituloRegistro() }}</p>
    </header>
    <dl class="nmv2-trazabilidad-panel__meta">
      <div>
        <dt>Responsable</dt>
        <dd>{{ lineaResponsable() }}</dd>
      </div>
      <div>
        <dt>Integridad</dt>
        <dd>{{ etiquetaIntegridad() }}</dd>
      </div>
      <div>
        <dt>Último registro</dt>
        <dd>{{ lineaResumen() }}</dd>
      </div>
    </dl>
    <button type="button" class="text-link nmv2-trazabilidad-panel__action" (click)="abrirDetalle()">
      <lucide-icon name="history" aria-hidden="true"></lucide-icon>
      Ver detalle de trazabilidad
    </button>
  </section>
} @else {
  <button
    type="button"
    class="nmv2-trazabilidad-paso"
    [class.nmv2-trazabilidad-paso--compact]="compacto()"
    (click)="abrirDetalle()"
    [attr.aria-label]="'Ver trazabilidad del paso'"
  >
    <span class="nmv2-trazabilidad-paso__copy">
      <lucide-icon name="shield-check" aria-hidden="true"></lucide-icon>
      <span>{{ lineaResumen() }}</span>
      <em>{{ etiquetaIntegridad() }}</em>
    </span>
    <lucide-icon class="nmv2-trazabilidad-paso__icon" name="history" aria-hidden="true"></lucide-icon>
  </button>
}
